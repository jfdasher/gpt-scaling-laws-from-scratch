[project]
name = "gptlab"
version = "0.1.0"
description = "Small GPT scaling laws, trained from scratch in plain PyTorch on Modal"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "pyarrow>=16",
    "huggingface_hub>=0.25",
    "wandb>=0.18",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "modal>=1.0",
    "transformers>=4.45",
    "safetensors>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gptlab"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
